<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cluster Trainer | Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;600;700;900&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0b1f1f;
      --panel:    #112929;
      --input:    #1a3a3a;
      --border:   #1e4040;
      --border2:  #245050;
      --cyan:     #00c2e0;
      --cyan-dim: #008fa3;
      --cyan-glow: rgba(0, 194, 224, .15);
      --white:    #f0fafa;
      --muted:    #6a9898;
      --error:    #f87171;
      --success:  #4ade80;

      /* cluster accent colors */
      --navy:   #1a2744;
      --yellow: #f5c400;
      --grey:   #6b7280;
      --green:  #16a34a;
      --blue:   #1d6fa4;
      --red:    #dc2626;
      --lime:   #84cc16;
      --purple: #7c3aed;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: 'Barlow', sans-serif;
      color: var(--white);
      overflow: hidden;
      user-select: none;
    }

    /* ── grid bg texture (matches auth-right::after) ── */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(var(--border2) 1px, transparent 1px),
        linear-gradient(90deg, var(--border2) 1px, transparent 1px);
      background-size: 56px 56px;
      opacity: .07;
      pointer-events: none;
      z-index: 0;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
    }

    /* ── CANVAS ── */
    #particle-canvas {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    /* ── PHASE BASE ── */
    .phase {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 450ms ease;
    }
    .phase.active {
      opacity: 1;
      pointer-events: all;
    }

    /* ────────────────────────────────
       PHASE 1 — Orb explode
    ──────────────────────────────── */
    #phase-explode { z-index: 50; }

    .sign-in-orb {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: var(--white);
      box-shadow:
        0 0 20px 6px rgba(255,255,255,.9),
        0 0 70px 18px rgba(214,232,255,.38);
      animation: orbPulse 0.55s cubic-bezier(.4,0,.2,1) forwards;
    }

    @keyframes orbPulse {
      0%   { transform: scale(1);   opacity: 1; box-shadow: 0 0 20px 6px rgba(255,255,255,.9), 0 0 70px 18px rgba(214,232,255,.38); }
      55%  { transform: scale(2.8); opacity: 1; box-shadow: 0 0 80px 40px rgba(0,194,224,.25), 0 0 140px 80px rgba(0,194,224,.1); }
      100% { transform: scale(4.5); opacity: 0; box-shadow: 0 0 0 0 transparent; }
    }

    /* ────────────────────────────────
       PHASE 2 — Brand drop
    ──────────────────────────────── */
    #phase-brand { gap: 0.2rem; z-index: 40; }

    .welcome-to {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 300;
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      transition: opacity 500ms ease;
    }

    .brand-fall {
      display: flex; flex-direction: column; align-items: center;
      transform: translateY(-100px);
      opacity: 0;
      transition: transform 580ms cubic-bezier(0.22,1,0.36,1), opacity 420ms ease;
    }

    .brand-cluster-big {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: clamp(4.5rem, 13vw, 10rem);
      letter-spacing: -0.01em;
      line-height: 0.88;
      text-transform: uppercase;
      color: var(--white);
      display: block;
    }

    .brand-trainer-big {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: clamp(4.5rem, 13vw, 10rem);
      letter-spacing: -0.01em;
      line-height: 0.88;
      text-transform: uppercase;
      color: var(--cyan);
      display: block;
    }
    #phase-grid { padding: 2rem; gap: 0; z-index: 30; }

    .grid-eyebrow {
      font-size: 2rem;
      font-weight: 1000;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    .cluster-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
      max-width: 860px;
      width: 100%;
    }

    .cluster-card {
      position: relative;
      border-radius: 10px;
      padding: 1.4rem 1.2rem;
      cursor: pointer;
      border: 1.5px solid var(--border);
      background: var(--panel);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 9rem;
      overflow: hidden;
    }

    .cluster-card::before {
      content: '';
      position: absolute; inset: 0;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .cluster-card:hover {
      transform: translateY(-3px) scale(1.015);
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--glow), 0 8px 24px rgba(0,0,0,0.35);
      background: var(--input);
    }

    .cluster-card:hover::before { opacity: 0.06; }

    .cluster-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: clamp(0.9rem, 1.6vw, 1.05rem);
      line-height: 1.15;
      text-transform: uppercase;
      color: var(--white);
      letter-spacing: 0.04em;
      position: relative; z-index: 1;
    }

    .cluster-count {
      margin-top: 0.5rem;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      font-weight: 500;
      text-transform: uppercase;
      position: relative; z-index: 1;
    }

    /* ────────────────────────────────
       PHASE 4 — Sub-events
    ──────────────────────────────── */
    #phase-events { padding: 2rem; z-index: 25; }
    #phase-level  { padding: 2rem; z-index: 999; }

    .events-inner {
      max-width: 640px;
      width: 100%;
    }

    .events-header {
      display: flex; align-items: center; gap: 1rem;
      margin-bottom: 0.6rem;
    }

    .back-btn {
      width: 34px; height: 34px;
      border-radius: 50%;
      border: 1.5px solid var(--border2);
      background: var(--panel);
      color: var(--muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      transition: border-color 0.2s, background 0.2s, color 0.2s;
      flex-shrink: 0;
    }

    .back-btn:hover {
      border-color: var(--cyan);
      background: var(--input);
      color: var(--cyan);
    }

    .events-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: clamp(1.5rem, 4vw, 2.4rem);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      line-height: 1;
      color: var(--white);
    }

    .events-accent-bar {
      height: 2px;
      width: 40px;
      border-radius: 2px;
      margin: 0.9rem 0 1.4rem 0;
      background: var(--cyan);
      transition: background 0.3s;
    }

    .events-list {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      max-height: 58vh;
      overflow-y: auto;
      padding-right: 6px;
      position: relative;
      z-index: 1;
    }

    .events-list::-webkit-scrollbar { width: 3px; }
    .events-list::-webkit-scrollbar-track { background: transparent; }
    .events-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    .event-item {
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      text-align: left;
      padding: 0.85rem 1.1rem;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--panel);
      cursor: pointer;
      font-family: 'Barlow', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.02em;
      transition: border-color 0.18s, background 0.18s, color 0.18s, transform 0.18s;
      position: relative;
      z-index: 1;
    }

    .event-item:hover {
      border-color: var(--active-accent, var(--cyan));
      background: var(--input);
      color: var(--white);
      transform: translateX(4px);
    }

    /* ────────────────────────────────
       PHASE 5 — Welcome splash
    ──────────────────────────────── */
    #phase-welcome { gap: 0.5rem; z-index: 20; }

    .welcome-sub {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .welcome-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: clamp(3.5rem, 10vw, 8rem);
      text-transform: uppercase;
      letter-spacing: -0.01em;
      line-height: 0.9;
      text-align: center;
      color: var(--cyan);
    }

    .tap-continue {
      margin-top: 2rem;
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      animation: blink 1.6s ease infinite;
    }

    .opening-status,
    .opening-tip {
      position: fixed;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      width: min(640px, calc(100vw - 2rem));
      padding: 0.9rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(17, 41, 41, 0.92);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(8px);
      z-index: 130;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease, border-color 180ms ease;
    }

    .opening-status.show,
    .opening-tip.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .opening-status {
      top: 1rem;
      color: var(--white);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .opening-status[data-kind="warning"] { border-color: rgba(248, 113, 113, 0.5); }
    .opening-status[data-kind="success"] { border-color: rgba(74, 222, 128, 0.45); }

    .opening-tip {
      bottom: 1rem;
      top: auto;
      max-width: 520px;
    }

    .opening-tip-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 0.35rem;
    }

    .opening-tip-text {
      font-size: 0.92rem;
      line-height: 1.5;
      color: var(--white);
    }

    .opening-skeleton {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      margin-top: 0.2rem;
    }

    .skeleton-item {
      height: 2.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background:
        linear-gradient(90deg,
          rgba(26, 58, 58, 0.75) 0%,
          rgba(36, 80, 80, 0.88) 50%,
          rgba(26, 58, 58, 0.75) 100%);
      background-size: 220% 100%;
      animation: shimmer 1.2s ease-in-out infinite;
    }

    .skeleton-item.sm {
      height: 2.1rem;
    }

    @keyframes shimmer {
      0%   { background-position: 100% 0; opacity: 0.72; }
      50%  { opacity: 1; }
      100% { background-position: 0 0; opacity: 0.72; }
    }

    @keyframes blink {
      0%, 100% { opacity: 0.35; }
      50%       { opacity: 0.85; }
    }

    /* ────────────────────────────────
       Shared animation keyframes
    ──────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<canvas id="particle-canvas"></canvas>
<div class="opening-status hidden" id="opening-status"></div>

</div>

<div class="phase" id="phase-grid">

<!-- PHASE 4 -->
<div class="phase" id="phase-events">

    <div class="events-list" id="events-list"></div>
  </div>
</div>

<!-- PHASE 5 -->
<div class="phase" id="phase-level">
  <div class="events-inner">
    <div class="events-header">
      <button class="back-btn" id="level-back-btn">&#8592;</button>

<!-- PHASE 6 -->

<script>
const DISPLAY_NAME = (() => {
  try {
    return (localStorage.getItem('displayName') || 'Competitor').split(' ')[0];
  } catch (error) {
    return 'Competitor';
  }
})();

const TIERS = [
  "Districts",
  "SCDC",
  "ICDC"
];

const STORAGE_KEYS = {
  competitionTier: 'ct_competitionTier',
  openingTourSeen: 'ct_openingTourSeen'
};

let openingLoadError = false;
let openingStatusTimer = null;
let openingTipTimer = null;

function getSavedTier() {
  try {
    return localStorage.getItem(STORAGE_KEYS.competitionTier) || null;
  } catch (error) {
    return null;
  }
}

function setSavedTier(tier) {
  try {
    if (tier) {
      localStorage.setItem(STORAGE_KEYS.competitionTier, tier);
    }
  } catch (error) {
    // ignore storage errors
  }
}

function hasSeenOpeningTour() {
  try {
    return localStorage.getItem(STORAGE_KEYS.openingTourSeen) === '1';
  } catch (error) {
    return true;
  }
}

function markOpeningTourSeen() {
  try {
    localStorage.setItem(STORAGE_KEYS.openingTourSeen, '1');
  } catch (error) {
    // ignore storage errors
  }
}

const OPENING_STATE = {
  source: null,
  user: null,
  skipCluster: false,
  clusterObj: null,
};

function getOpeningSource() {
  try {
    const raw = sessionStorage.getItem('ct_opening_intro');
    if (!raw) return null;
    const data = JSON.parse(raw);
    return data?.source || null;
  } catch (error) {
    return null;
  }
}

function getStoredAuthToken() {
  return localStorage.getItem('ct_token') || sessionStorage.getItem('ct_token') || null;
}

async function fetchCurrentUser() {
  const token = getStoredAuthToken();
  if (!token) return null;

  try {
    const res = await fetch('/auth/me', {
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`,
      },
      credentials: 'same-origin',
    });
    if (!res.ok) return null;
    const payload = await res.json().catch(() => null);
    return payload?.user || null;
  } catch (error) {
    openingLoadError = true;
    return null;
  }
}

function findClusterByName(name) {
  return CLUSTERS.find(c => c.name === name) || null;
}

async function saveUserCluster(clusterName) {
  const token = getStoredAuthToken();
  if (!token) return false;

  try {
    const res = await fetch('/auth/profile', {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`,
      },
      credentials: 'same-origin',
      body: JSON.stringify({ cluster: clusterName }),
    });
    if (!res.ok) return false;
    const data = await res.json().catch(() => null);
    if (!data?.user) return false;
    OPENING_STATE.user = data.user;
    OPENING_STATE.clusterObj = findClusterByName(data.user.cluster) || OPENING_STATE.clusterObj;
    return true;
  } catch (error) {
    return false;
  }
}

async function initOpeningContext() {
  OPENING_STATE.source = getOpeningSource();
  OPENING_STATE.user = await fetchCurrentUser();
  if (OPENING_STATE.user) {
    OPENING_STATE.clusterObj = findClusterByName(OPENING_STATE.user.cluster || '') || null;
    if (OPENING_STATE.source === 'signin' && OPENING_STATE.clusterObj) {
      OPENING_STATE.skipCluster = true;
    }
  }
}

// ── PARTICLES ─────────────────────────────────────────────────────────────────
const canvas = document.getElementById('particle-canvas');
const ctx    = canvas.getContext('2d');
let particles = [];

function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function spawnShards(x, y) {
  const count = 32;
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
    const speed = 5 + Math.random() * 16;
    // mix white and cyan shards
    const isCyan = Math.random() > 0.55;
    particles.push({
      x, y,
      vx:    Math.cos(angle) * speed,
      vy:    Math.sin(angle) * speed,
      size:  3 + Math.random() * 9,
      rot:   Math.random() * Math.PI * 2,
      rotV:  (Math.random() - 0.5) * 0.25,
      life:  1,
      color: isCyan ? '#00c2e0' : '#f0fafa'
    });
  }
}

function animParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.x   += p.vx;
    p.y   += p.vy;
    p.vy  += 0.45;
    p.vx  *= 0.97;
    p.life -= 0.032;
    p.rot  += p.rotV;
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.55);
    ctx.restore();
  }
  requestAnimationFrame(animParticles);
}
animParticles();

// ── PHASE HELPERS ──────────────────────────────────────────────────────────────
function activatePhase(el) {
  el.classList.add('active');
}

function deactivatePhase(el) {
  el.classList.remove('active');
}

function transitionTo(from, to, delay = 0) {
  return new Promise(res => {
    setTimeout(() => {
      deactivatePhase(from);
      setTimeout(() => {
        activatePhase(to);
        res();
      }, 800);
    }, delay);
  });
}

function setOpeningStatus(message, kind = 'info', duration = 3000) {
  const el = document.getElementById('opening-status');
  if (!el) return;

  window.clearTimeout(openingStatusTimer);
  el.textContent = message || '';
  el.dataset.kind = kind;
  el.classList.toggle('hidden', !message);
  el.classList.add('show');

  if (message && duration > 0) {
    openingStatusTimer = window.setTimeout(() => {
      el.classList.remove('show');
      window.setTimeout(() => el.classList.add('hidden'), 200);
    }, duration);
  }
}

function showOpeningTip(message, duration = 5000) {
  const el = document.getElementById('opening-tip');
  const text = document.getElementById('opening-tip-text');
  if (!el || !text) return;
  if (hasSeenOpeningTour()) return;

  window.clearTimeout(openingTipTimer);
  text.textContent = message || '';
  el.classList.remove('hidden');
  el.classList.add('show');

  if (duration > 0) {
    openingTipTimer = window.setTimeout(() => hideOpeningTip(true), duration);
  }
}

function hideOpeningTip(markSeen = false) {
  const el = document.getElementById('opening-tip');
  if (!el) return;

  window.clearTimeout(openingTipTimer);
  el.classList.remove('show');
  window.setTimeout(() => el.classList.add('hidden'), 200);
  if (markSeen) markOpeningTourSeen();
}

function renderSkeletonList(listEl, count = 3, compact = false) {
  if (!listEl) return;
  listEl.innerHTML = '';
  listEl.setAttribute('aria-busy', 'true');
  listEl.classList.add('opening-skeleton');
  for (let i = 0; i < count; i++) {
    const item = document.createElement('div');
    item.className = compact ? 'skeleton-item sm' : 'skeleton-item';
    listEl.appendChild(item);
  }
}

function clearSkeletonList(listEl) {
  if (!listEl) return;
  listEl.removeAttribute('aria-busy');
  listEl.classList.remove('opening-skeleton');
}

// ── BUILD CLUSTER GRID ────────────────────────────────────────────────────────
const gridEl = document.getElementById('cluster-grid');
CLUSTERS.forEach((c, i) => {
  const card = document.createElement('div');
  card.className = 'cluster-card';
  card.style.setProperty('--accent', c.color);
  card.style.setProperty('--glow',   c.glow);
  card.innerHTML = `
    <div class="cluster-name">${c.name}</div>
    <div class="cluster-count">${c.events.length ? c.events.length + ' events' : 'Core event'}</div>
  `;
  card.addEventListener('click', () => openCluster(i));
  gridEl.appendChild(card);
});

// ── PHASE REFERENCES ──────────────────────────────────────────────────────────
const phExplode = document.getElementById('phase-explode');
const phBrand   = document.getElementById('phase-brand');
const phGrid    = document.getElementById('phase-grid');
const phEvents  = document.getElementById('phase-events');
const phLevel   = document.getElementById('phase-level');
const phWelcome = document.getElementById('phase-welcome');

const welcomeToEl = document.getElementById('welcome-to');
const brandFallEl = document.getElementById('brand-fall');
const welcomeSubEl = document.getElementById('welcome-sub');


// ── SEQUENCE ───────────────────────────────────────────────────────────────────
function startSequence() {
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;

  // Spawn shards during orb burst
  setTimeout(() => spawnShards(cx, cy),       190);
  setTimeout(() => spawnShards(cx+8, cy-8),   270);
  setTimeout(() => spawnShards(cx-8, cy+8),   340);

  // Switch to brand phase
  setTimeout(() => {
    deactivatePhase(phExplode);

    setTimeout(() => {
      activatePhase(phBrand);

      // Stagger: welcome-to fades in first
      welcomeToEl.style.transition = 'opacity 800ms ease';
      welcomeToEl.style.opacity = '0';
      setTimeout(() => { welcomeToEl.style.opacity = '1'; }, 100);

      // Brand drops down
      brandFallEl.style.transition = 'none';
      brandFallEl.style.transform  = 'translateY(-110px)';
      brandFallEl.style.opacity    = '0';
      setTimeout(() => {
        brandFallEl.style.transition = 'transform 1000ms cubic-bezier(0.22,1,0.36,1), opacity 700ms ease';
        brandFallEl.style.transform  = 'translateY(0)';
        brandFallEl.style.opacity    = '1';
      }, 300);

      // Hold → fade to grid or welcome
      setTimeout(() => {
        deactivatePhase(phBrand);
        setTimeout(() => {
          if (OPENING_STATE.skipCluster) {
            showWelcome(OPENING_STATE.clusterObj || CLUSTERS[0], phBrand, null, { forceWelcomeBack: true });
          } else {
            activatePhase(phGrid);
            if (!hasSeenOpeningTour()) {
              showOpeningTip('Choose your cluster to begin. You can change your competition tier after that.');
            }
          }
        }, 800);
      }, 3500);

    }, 800);
  }, 680);
}

// ── OPEN CLUSTER ───────────────────────────────────────────────────────────────
async function openCluster(index) {
  const cluster = CLUSTERS[index];
  hideOpeningTip(true);

  if (OPENING_STATE.user && !OPENING_STATE.user.cluster) {
    await saveUserCluster(cluster.name);
  }

  if (cluster.events.length === 0) {
    openLevelSelection(cluster, phGrid);
    return;
  }

  document.getElementById('events-title').textContent    = cluster.name;
  document.getElementById('events-title').style.color    = cluster.color;
  document.getElementById('events-accent-bar').style.background = cluster.color;
  document.body.style.setProperty('--active-accent', cluster.color);

  const list = document.getElementById('events-list');
  renderSkeletonList(list, Math.min(Math.max(cluster.events.length, 3), 5));
  window.setTimeout(() => {
    clearSkeletonList(list);
    list.innerHTML = '';
    cluster.events.forEach(ev => {
      const item = document.createElement('div');
      item.type = 'button';
      item.className   = 'event-item';
      item.textContent = ev;
      item.style.setProperty('--active-accent', cluster.color);
      item.addEventListener('click', () => openLevelSelection(cluster, phEvents));
      list.appendChild(item);
    });
  }, 140);

  deactivatePhase(phGrid);
  activatePhase(phEvents);
}

function openLevelSelection(cluster, fromPhase) {
  const currentTier = getSavedTier();
  hideOpeningTip(true);

  document.getElementById('level-title').textContent = 'Competition Tier';
  document.getElementById('level-accent-bar').style.background = cluster.color;
  document.body.style.setProperty('--active-accent', cluster.color);

  const list = document.getElementById('level-list');
  list.style.pointerEvents = 'auto';
  deactivatePhase(fromPhase);
  activatePhase(phLevel);
  list.innerHTML = '';
  TIERS.forEach(tier => {
    const item = document.createElement('button');
    item.type = 'button';
    item.className   = 'event-item';
    item.textContent = tier + (tier === currentTier ? ' ✓' : '');
    item.style.setProperty('--active-accent', cluster.color);
    const chooseTier = () => {
      setSavedTier(tier);
      showWelcome(cluster, phLevel, tier);
    };
    item.addEventListener('pointerdown', chooseTier);
    item.addEventListener('click', chooseTier);
    list.appendChild(item);
  });
}

document.getElementById('back-btn').addEventListener('click', () => {
  deactivatePhase(phEvents);
  setTimeout(() => activatePhase(phGrid), 800);
});

document.getElementById('level-back-btn').addEventListener('click', () => {
  deactivatePhase(phLevel);
  setTimeout(() => activatePhase(phGrid), 800);
});

// ── WELCOME SPLASH ─────────────────────────────────────────────────────────────
function showWelcome(cluster, fromPhase, tier, options = {}) {
  const selectedTier = tier || getSavedTier();
  const displayName = (OPENING_STATE.user?.display_name || DISPLAY_NAME).split(' ')[0];

  if (options.forceWelcomeBack || (OPENING_STATE.source === 'signin' && OPENING_STATE.clusterObj)) {
    welcomeSubEl.textContent = 'Welcome back,';
  } else {
    welcomeSubEl.textContent = selectedTier ? `Studying for ${selectedTier},` : "Let's get started,";
  }

  document.getElementById('welcome-name').textContent = displayName;
  document.getElementById('welcome-name').style.color = cluster.color;

  deactivatePhase(fromPhase);
  setTimeout(() => activatePhase(phWelcome), 800);
}

phWelcome.addEventListener('click', () => {
  markOpeningTourSeen();
  window.location.href = '/app/dashboard.html';
});

// ── BOOT ───────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  await initOpeningContext();
  startSequence();
  if (openingLoadError) {
    window.setTimeout(() => {
      setOpeningStatus('We could not load your saved profile from Supabase, but you can still continue.', 'warning', 6000);
    }, 4200);
  }
});
</script>
