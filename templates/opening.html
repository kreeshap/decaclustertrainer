<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cluster Trainer | Welcome</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;600;700;900&family=Barlow:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <script src="/static/js/clusters.js"></script>
        <script src="/static/js/common.js"></script>
        <link rel="stylesheet" href="/static/styles/opening.css" />
    </head>
    <body>
        <canvas id="particle-canvas"></canvas>
        <div class="opening-status hidden" id="opening-status"></div>
        <div class="opening-tip hidden" id="opening-tip">
            <div class="opening-tip-label">Quick tip</div>
            <div class="opening-tip-text" id="opening-tip-text"></div>
        </div>

        <!-- PHASE 1 -->
        <div class="phase active" id="phase-explode">
            <div class="sign-in-orb"></div>
        </div>

        <!-- PHASE 2 -->
        <div class="phase" id="phase-brand">
            <div class="welcome-to" id="welcome-to">Let's get started with</div>
            <div class="brand-fall" id="brand-fall">
                <span class="brand-cluster-big">Cluster</span>
                <span class="brand-trainer-big">Trainer</span>
            </div>
        </div>

        <!-- PHASE 3 -->
        <div class="phase" id="phase-grid">
            <div class="grid-eyebrow">Choose your cluster:</div>
            <div class="cluster-grid" id="cluster-grid"></div>
        </div>

        <!-- PHASE 4 -->
        <div class="phase" id="phase-events">
            <div class="events-inner">
                <div class="events-header">
                    <button class="back-btn" id="back-btn">&#8592;</button>
                    <div class="events-title" id="events-title"></div>
                </div>
                <div class="events-accent-bar" id="events-accent-bar"></div>
                <div class="events-list" id="events-list"></div>
            </div>
        </div>

        <!-- PHASE 5 -->
        <div class="phase" id="phase-level">
            <div class="events-inner">
                <div class="events-header">
                    <button class="back-btn" id="level-back-btn">
                        &#8592;
                    </button>
                    <div class="events-title" id="level-title">
                        What Competition are you studying for?
                    </div>
                </div>
                <div class="events-accent-bar" id="level-accent-bar"></div>
                <div class="events-list" id="level-list"></div>
            </div>
        </div>

        <!-- PHASE 6 -->
        <div class="phase" id="phase-welcome">
            <div class="welcome-sub" id="welcome-sub">Let's get started,</div>
            <div class="welcome-name" id="welcome-name"></div>
            <div class="tap-continue">Tap anywhere to continue</div>
        </div>

        <script src="/static/js/opening.js"></script>
    </body>
</html>
