<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cluster Trainer - Learn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;600;700;900&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="/static/js/common.js"></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1f1f;
        --panel: #112929;
        --input: #1a3a3a;
        --border: #1e4040;
        --border2: #245050;
        --cyan: #00c2e0;
        --cyan-glow: rgba(0, 194, 224, .15);
        --white: #f0fafa;
        --muted: #6a9898;
      }

      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100vh; }
      body {
        background: var(--bg);
        color: var(--white);
        font-family: 'Barlow', sans-serif;
        padding-top: 56px;
      }
      .app-topbar {
        position: fixed; top: 0; left: 0; right: 0; z-index: 100;
        height: 56px; display: flex; align-items: center;
        padding: 0 24px; background: rgba(11, 31, 31, .92);
        border-bottom: 1px solid var(--border); backdrop-filter: blur(10px);
      }
      .app-brand {
        font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
        font-size: 1.05rem; letter-spacing: .06em; text-transform: uppercase;
        color: var(--white); margin-right: 32px; white-space: nowrap; cursor: pointer;
      }
      .app-brand em { color: var(--cyan); font-style: normal; }
      .app-nav { display: flex; gap: 4px; flex: 1; min-width: 0; }
      .topbar-link {
        font-size: .74rem; font-weight: 600; letter-spacing: .05em;
        text-transform: uppercase; color: var(--muted);
        padding: 5px 12px; border-radius: 4px; text-decoration: none;
        position: relative; white-space: nowrap;
      }
      .topbar-link:hover { color: var(--white); }
      .topbar-link.active { color: var(--cyan); }
      .topbar-link.active::after {
        content: ''; position: absolute; left: 12px; right: 12px; bottom: -2px;
        height: 2px; border-radius: 2px; background: var(--cyan);
      }
      .topbar-right { display: flex; align-items: center; gap: 12px; margin-left: auto; }
      .user-chip { font-size: .8rem; color: var(--muted); padding: 5px 12px; border: 1px solid var(--border); border-radius: 20px; white-space: nowrap; }
      .btn-sm {
        background: transparent; border: 1.5px solid var(--border); border-radius: 6px;
        color: var(--muted); padding: 6px 14px; font-family: 'Barlow', sans-serif;
        font-size: .78rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
        cursor: pointer;
      }
      .btn-icon {
        background: transparent; border: 1.5px solid var(--border2); border-radius: 6px;
        color: var(--white); width: 34px; height: 34px; display: flex;
        align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
      }
      .btn-icon svg { display: block; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .main-shell { max-width: 1100px; margin: 0 auto; padding: 28px 28px 56px; }
      .app-sec { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
      .dash-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 2rem; line-height: 1.1; margin: 0 0 18px 0; }
      .dash-title em { color: var(--cyan); font-style: normal; }
      .panel { border: 1px solid var(--border); border-radius: 8px; padding: 20px 22px; background: rgba(19,47,47,.35); }
    </style>
  </head>
  <body>
    <header class="app-topbar">
      <div class="app-brand">CLUSTER <em>TRAINER</em></div>
      <nav class="app-nav" id="dashboard-nav" aria-label="Primary"></nav>
      <div class="topbar-right">
        <div class="user-chip" id="topbar-name"></div>
        <button class="btn-icon" id="btn-settings" type="button" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.05.05a2 2 0 0 1-1.42 3.42h-.07a1.7 1.7 0 0 0-1.6 1.1l-.02.06a2 2 0 0 1-3.86 0l-.02-.06a1.7 1.7 0 0 0-1.6-1.1h-.07a2 2 0 0 1-1.42-3.42l.05-.05A1.7 1.7 0 0 0 5.6 15l-.02-.07a2 2 0 0 1 0-1.86l.02-.07a1.7 1.7 0 0 0-.34-1.87l-.05-.05a2 2 0 0 1 1.42-3.42h.07a1.7 1.7 0 0 0 1.6-1.1l.02-.06a2 2 0 0 1 3.86 0l.02.06a1.7 1.7 0 0 0 1.6 1.1h.07a2 2 0 0 1 1.42 3.42l-.05.05a1.7 1.7 0 0 0-.34 1.87l.02.07a2 2 0 0 1 0 1.86z"></path>
          </svg>
        </button>
        <button class="btn-sm" id="btn-logout" type="button">Log out</button>
      </div>
    </header>
    <main class="main-shell">
      <section class="dash-header">
        <div>
          <div class="app-sec">Learn</div>
          <h1 class="dash-title"><em>Learn</em> mode home</h1>
        </div>
      </section>
      <div class="panel">
        <p>This is the learn home page.</p>
      </div>
    </main>
    <script>
      requireAuth().then((user) => {
        if (user) {
          initTopbar(user);
        }
      });
    </script>
  </body>
</html>
