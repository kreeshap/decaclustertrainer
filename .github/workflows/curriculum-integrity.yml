name: Curriculum integrity

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/validate_finance.py
      - run: python scripts/validate_marketing.py
      - run: python scripts/validate_all_sources.py
      - run: python scripts/cross_cluster_validation.py
      - run: python scripts/test_curriculum_experience.py
      - run: python scripts/test_content_quality_v1.py
      - run: python scripts/test_practice_corpus_v1.py
